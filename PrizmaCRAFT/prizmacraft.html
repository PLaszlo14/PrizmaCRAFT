<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrizmaCRAFT – Ahol az ötletek formát öltenek</title>
    <!-- Google Fonts beágyazás a modern megjelenésért -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- ALAPSTÍLUSOK & VÁLTOZÓK --- */
        :root {
            --bg-dark: #121316;
            --bg-card: #1c1e22;
            --bg-light: #ffffff;
            --text-light: #f3f4f6;
            --text-dark: #1f2937;
            --text-muted: #9ca3af;
            --primary: #00f2fe; /* Neon ciánkék */
            --secondary: #4facfe; /* Kék */
            --accent: #9b51e0; /* Prizma lila */
            --gradient: linear-gradient(135deg, #00f2fe 0%, #9b51e0 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        body {
            overflow-x: hidden;
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 0;
        }

        h1, h2, h3 {
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .section-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 50px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- NAVIGÁCIÓ (HEADER) --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 19, 22, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(155, 81, 224, 0.15) 0%, rgba(12, 19, 22, 0) 70%);
            padding-top: 100px;
        }

        .hero-content {
            max-width: 800px;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero h1 span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: var(--gradient);
            color: #121316;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        /* --- RÓLUNK SECTION --- */
        .about {
            background-color: var(--bg-card);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .about-text {
            max-width: 800px;
            margin: 0 auto text-align center;
            text-align: center;
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 50px;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .team-member {
            background-color: var(--bg-dark);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: border 0.3s;
        }

        .team-member:hover {
            border-color: var(--accent);
        }

        .member-avatar {
            width: 80px;
            height: 80px;
            background: var(--gradient);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--bg-dark);
            font-size: 1.5rem;
        }

        .team-member h3 {
            margin-bottom: 5px;
            color: var(--text-light);
        }

        .team-member p {
            color: var(--primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- SZOLGÁLTATÁSOK (KÁRTYÁK) --- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 40px;
        }

        @media (max-width: 768px) {
            .services-grid {
                grid-template-columns: 1fr;
            }
        }

        .service-card {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
        }

        .service-icon {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--text-light);
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .service-card ul {
            list-style: none;
        }

        .service-card li {
            margin-bottom: 15px;
            position: relative;
            padding-left: 25px;
            color: var(--text-muted);
        }

        .service-card li::before {
            content: "✦";
            position: absolute;
            left: 0;
            color: var(--primary);
        }

        /* --- CÉLKÖZÖNSÉG BLOKK --- */
        .audience {
            background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-card) 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .audience-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .audience-box {
            background-color: rgba(18, 19, 22, 0.6);
            padding: 40px;
            border-radius: 15px;
            border-left: 4px solid var(--accent);
        }

        .audience-box h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--text-light);
        }

        .audience-box p {
            color: var(--text-muted);
        }

        /* --- KAPCSOLAT & ŰRLAP --- */
        .contact {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        .contact .section-title {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-wrapper {
            max-width: 650px;
            margin: 0 auto;
            background-color: #f9fafb;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            background-color: #fff;
